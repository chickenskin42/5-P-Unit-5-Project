<!DOCTYPE html>
<html>

<head>
  <title>Unit 5 Project</title>
  <meta charset="utf-8">
  <style>
body {
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGcE4Obthi1uJvWnd-bLdzl2PEo-6jCgHaO-1eLi1KKA&s=10');
}
h1 {
  font-size: 72px;
  font-weight: bold;
  text-transform: uppercase;
  padding: 0;
  margin: 0;

  color: transparent;
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRl7dJ_LpnSAd8xGBmbwDsUQkfS5qgvg81ZDGaN5yYoMQ&s=10');
  background-clip: text;
  background-color: green;
}
img {
  border: 5px solid rgb(34, 97, 21);
  margin: 10px;
  padding: 0px;
}
p {
  color:rgb(8, 133, 8);
  font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
.overlay-text{
  background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRd0Mn-GNkG5u9veFlp8sChkL2fan08nqHH8Np-LRX5uw&s=10);
  height: 400px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
}
.card {
  /* Add shadows to create the "card" effect */
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
  transition: 0.3s;
}

/* On mouse-over, add a deeper shadow */
.card:hover {
  box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
}

/* Add some padding inside the card container */
.container {
  padding: 2px 16px;
}
  </style>
</head>
<body>
<h1>Happy Holiday Bird</h1>
<div>
<p>DO YOU LIKE BIRDS?
  <br>
  IF YOU DON'T, YOU DO NOW
</p>
 </div>
<div class="image-container"></div>
<div class="overlay-text">
    <p>MUAHAHAHAHAHA</p></div>
<div class="card">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuK6BadJsIJq1Jcb3f3P_n5Y3k0RG7ID9XQrjAV1ycaQ&s=10" alt="Avatar" style="width: 300px;">
  <div class="container">
    <h4><b>Woodstock</b></h4>
    <p>Snoopy's Favorite Bird</p>
  </div>
  </div>
</div>
</div>
</body>
